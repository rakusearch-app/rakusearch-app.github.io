# Supabaseの無料プランは、1週間ほとんどアクセスがないとプロジェクトが停止する。
# 停止すると、全員のライセンス確認が失敗するため、毎日1回、ライセンス確認の関数を呼んで、
# データベースへのアクセスを作る(ダミーの鍵を送るだけで、個人情報も契約情報も使わない)。
name: keepalive

on:
  schedule:
    - cron: "17 3 * * *"   # 毎日 03:17 UTC(日本時間の12:17)
  workflow_dispatch:        # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ライセンス確認の関数を呼ぶ
        run: |
          curl -fsS -m 30 -X POST "https://gnaccktgjrupjbadzgez.supabase.co/functions/v1/check-license" \
            -H "Content-Type: application/json" \
            -d '{"token":"keepalive-dummy-token-not-a-real-key","device_id":"dev_keepalive"}'
